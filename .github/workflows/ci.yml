# TuneItVerse CI — Rust backend check/test + Node install sanity
name: TuneItVerse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust:
    name: Cargo check & test (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: cargo check
        run: cargo check --locked --target ${{ matrix.target }}

      - name: cargo test (lib unit tests)
        run: cargo test --locked --lib --target ${{ matrix.target }} -- --nocapture

      # Unsigned unless repository variable SIGN_RELEASES is true and the
      # WINDOWS_PFX_BASE64 secret is set. A missing secret fails the job so a
      # signed artifact name is never a lie. The i686 exe loads 32-bit J2534 DLLs.
      - name: cargo build --release (exe artifact)
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Sign release exe when a certificate is configured
        if: vars.SIGN_RELEASES == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: "& ../scripts/sign-exe.ps1 -Path \"target/${{ matrix.target }}/release/TuneItVerse.exe\""

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuneItVerse-${{ matrix.target }}-${{ vars.SIGN_RELEASES == 'true' && 'signed' || 'unsigned' }}
          path: src-tauri/target/${{ matrix.target }}/release/*.exe
          if-no-files-found: error
          retention-days: 14

  node:
    name: npm install & scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm ci
        run: npm ci

      - name: npm test (sanity)
        run: npm test

      - name: tauri CLI present
        run: npx tauri --version

  sign-check:
    name: Sign script stays unsigned without a certificate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check-only reports unsigned
        shell: pwsh
        run: |
          $out = & ./scripts/sign-exe.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "check-only exit $LASTEXITCODE" }
          if ($out -notmatch 'unsigned') { throw "expected unsigned, got: $out" }

      - name: Missing certificate is exit 2
        shell: pwsh
        run: |
          Remove-Item Env:WINDOWS_PFX_BASE64 -ErrorAction SilentlyContinue
          & ./scripts/sign-exe.ps1 -Path "$env:TEMP\tuneitverse-missing.exe"
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2, got $LASTEXITCODE" }
