[package]
name = "tuneitverse"
version = "0.2.0"
edition = "2021"

[lib]
name = "tuneitverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tuneitverse"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "dialog", "fs", "shell"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
libloading = "0.8"
serialport = "4.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
