<!-- Enhanced Connect Modal with Advanced CAN/ISO-TP Settings -->
<div id="connect-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Connect to ECU / Hardware</h2>
    <div class="modal-body">
      <!-- Existing Hardware Type selection -->
      <div style="margin-bottom:12px;">
        <label><strong>Hardware Type</strong></label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <label class="radio-card" style="flex:1; padding:8px;">
            <input type="radio" name="hw-type" value="elm" checked />
            <div><strong>ELM / OBDLink / Serial</strong><br><span style="font-size:10px; color:var(--text-faint);">Common for OBD2 (your MX+)</span></div>
          </label>
          <label class="radio-card" style="flex:1; padding:8px;">
            <input type="radio" name="hw-type" value="j2534" />
            <div><strong>J2534 Professional</strong><br><span style="font-size:10px; color:var(--text-faint);">OpenPort, Tactrix, etc. (Windows)</span></div>
          </label>
        </div>
      </div>

      <!-- Existing ELM section -->
      <div id="elm-section">
        <!-- port, baud, protocol selects as before -->
      </div>

      <!-- Existing J2534 section -->
      <div id="j2534-section" style="display:none;">
        <!-- J2534 detection as before -->
      </div>

      <!-- NEW: Advanced CAN / ISO-TP Settings -->
      <div style="margin-top:16px; border-top:1px solid var(--border-subtle); padding-top:12px;">
        <label style="font-weight:600; font-size:12px;">Advanced CAN / ISO-TP Settings</label>
        <div style="margin-top:8px; display:grid; grid-template-columns: 1fr 1fr; gap:12px; font-size:11px;">
          
          <!-- CAN FD Toggle -->
          <div>
            <label style="display:flex; align-items:center; gap:6px;">
              <input type="checkbox" id="enable-can-fd" />
              <span><strong>Enable CAN FD</strong></span>
            </label>
            <div style="font-size:9px; color:var(--text-faint); margin-top:2px;">Requires J2534 or CAN FD capable hardware</div>
          </div>

          <!-- ISO-TP Block Size -->
          <div>
            <label>Block Size (BS)</label>
            <input type="number" id="iso-block-size" value="0" min="0" max="255" style="width:100%;" />
            <div style="font-size:9px; color:var(--text-faint);">0 = unlimited</div>
          </div>

          <!-- ISO-TP STmin -->
          <div>
            <label>STmin (ms)</label>
            <input type="number" id="iso-stmin" value="5" min="0" max="100" style="width:100%;" />
            <div style="font-size:9px; color:var(--text-faint);">Separation time between frames</div>
          </div>

        </div>
        <div style="font-size:9px; color:var(--text-faint); margin-top:6px;">
          These settings apply to ISO-TP communication (UDS on CAN). Adjust for stability on your adapter/ECU.
        </div>
      </div>

    </div>

    <div class="modal-actions">
      <button id="btn-modal-connect" class="btn-primary">Connect</button>
      <button id="btn-modal-cancel" class="btn-secondary">Cancel</button>
    </div>
  </div>
</div>
