[package]
name = "TuneItVerse"
version = "2.5.3"
description = "ECU Tuning platform for JRTuners - Industry leading open source alternative to expensive commercial tools. Fully operational v2.5.3 with complete Priority 0 safety gates, real Bosch/GM algorithms, production J2534, scalable ECU DB, full guided flash + live verify + continuous voltage + real Mode 01 live PID path. Aggressive analysis confirmed no critical gaps."
authors = ["JRTuners"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tune_it_verse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.31", features = ["serialize"] }
libloading = "0.8"
# For future Windows registry scan for J2534 devices (optional, cfg gated)
# winreg = { version = "0.52", optional = true }
