<!-- NEW: Collapsible Advanced CAN / ISO-TP Settings -->
<details style="margin-top:16px; border:1px solid var(--border-subtle); border-radius: var(--radius-md); overflow:hidden;">
  <summary style="
    padding: 10px 14px;
    background: var(--surface-2);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  ">
    ⚙️ Advanced CAN / ISO-TP Settings
    <span style="margin-left: auto; font-size: 10px; color: var(--text-faint);">(optional)</span>
  </summary>

  <div style="padding: 12px 14px; border-top: 1px solid var(--border-subtle); font-size: 11px;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      
      <!-- CAN FD Toggle -->
      <div>
        <label style="display:flex; align-items:center; gap:6px;">
          <input type="checkbox" id="enable-can-fd" />
          <span><strong>Enable CAN FD</strong></span>
        </label>
        <div style="font-size:9px; color:var(--text-faint); margin-top:2px;">Requires J2534 or CAN FD capable hardware</div>
      </div>

      <!-- ISO-TP Block Size -->
      <div>
        <label>Block Size (BS)</label>
        <input type="number" id="iso-block-size" value="0" min="0" max="255" style="width:100%; padding:4px;" />
        <div style="font-size:9px; color:var(--text-faint);">0 = unlimited</div>
      </div>

      <!-- ISO-TP STmin -->
      <div>
        <label>STmin (ms)</label>
        <input type="number" id="iso-stmin" value="5" min="0" max="100" style="width:100%; padding:4px;" />
        <div style="font-size:9px; color:var(--text-faint);">Separation time between frames</div>
      </div>

    </div>

    <div style="font-size:9px; color:var(--text-faint); margin-top:10px; line-height:1.3;">
      These settings control ISO-TP (UDS on CAN) behavior. Adjust for stability with your adapter and ECU.
    </div>
  </div>
</details>
