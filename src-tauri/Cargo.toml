[package]
name = "TuneItVerse"
version = "3.10.0"
description = "ECU Tuning platform for JRTuners. v3.10.0: no invented live PIDs, fail-closed unverified Bosch keys, identified flash family, visual UI."
authors = ["JRTuners"]
edition = "2021"

[lib]
name = "tune_it_verse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.31", features = ["serialize"] }
libloading = "0.8"
