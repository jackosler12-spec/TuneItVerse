<!-- Add in toolbar or a new advanced section, e.g. near connection status -->
<div class="toolbar">
  <!-- existing buttons -->
  <label style="display:flex; align-items:center; gap:6px; font-size:11px; margin-left:12px;">
    <input type="checkbox" id="toggle-iso-stats" />
    <span>ISO-TP Stats</span>
  </label>
</div>

<!-- ISO-TP Stats Panel (hidden by default) -->
<div id="iso-stats-panel" class="panel" style="display:none; position:fixed; bottom:30px; right:20px; width:280px; z-index:100; font-size:11px;">
  <div class="panel-header">
    <div class="panel-title">ISO-TP Statistics</div>
    <button class="btn-sm" id="btn-reset-iso-stats">Reset</button>
  </div>
  <div style="padding:8px; font-family:monospace; line-height:1.4;">
    <div>FF Sent: <span id="stat-ff-sent">0</span></div>
    <div>CF Sent: <span id="stat-cf-sent">0</span></div>
    <div>FC Received: <span id="stat-fc-rcv">0</span></div>
    <div>Bytes Sent: <span id="stat-bytes-sent">0</span></div>
    <div>Bytes Received: <span id="stat-bytes-rcv">0</span></div>
    <div style="color:var(--danger);">Errors: <span id="stat-errors">0</span></div>
    <div id="stat-last-error" style="color:var(--warning); font-size:10px; margin-top:4px;"></div>
  </div>
</div>
