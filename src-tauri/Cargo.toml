[package]
name = "tuneitverse"
version = "0.2.0"
edition = "2021"

[lib]
name = "tuneitverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tuneitverse"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "dialog", "fs", "shell"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8"
serialport = "4.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tauri-plugin-log = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
